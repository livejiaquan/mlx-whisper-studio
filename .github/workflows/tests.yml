name: Output safety tests

on:
  push:
    branches: [main, "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test output and cancellation safety without MLX or model downloads
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q app.py mlx_worker.py output_files.py tests
